<div id="git-mood" class="viz-carousel viz-dotted-background" aria-label="GitHub 安卓客户端风格探索" data-previous-label="上一种风格" data-next-label="下一种风格">
  <section class="stage" data-variant="黑白字排" aria-label="黑白字排风格"><div class="phone mono" data-style="mono" aria-label="黑白字排外观"></div></section>
  <section class="stage" data-variant="紧凑清单" aria-label="紧凑清单风格" hidden><div class="phone ledger" data-style="ledger" aria-label="紧凑清单外观"></div></section>
  <section class="stage" data-variant="动态时间线" aria-label="动态时间线风格" hidden><div class="phone stream" data-style="stream" aria-label="动态时间线外观"></div></section>
  <section class="stage" data-variant="封面阅读" aria-label="封面阅读风格" hidden><div class="phone cover" data-style="cover" aria-label="封面阅读外观"></div></section>
  <section class="stage" data-variant="清爽留白" aria-label="清爽留白风格" hidden><div class="phone minimal" data-style="minimal" aria-label="清爽留白外观"></div></section>
  <section class="stage" data-variant="纸感阅读" aria-label="纸感阅读风格" hidden><div class="phone paper" data-style="paper" aria-label="纸感阅读外观"></div></section>
</div>
<script>
(function () {
  const root = document.getElementById('git-mood');
  const names = { mono: '黑白字排', ledger: '紧凑清单', stream: '动态时间线', cover: '封面阅读', minimal: '清爽留白', paper: '纸感阅读' };
  const tabNames = { discover: '发现', inbox: '收件箱', repos: '仓库', saved: '收藏' };
  const tabIcons = { discover: 'compass', inbox: 'inbox', repos: 'folder-git-2', saved: 'bookmark' };
  const modules = { release: '最新版本', work: 'Issue 与 PR', actions: 'Actions', activity: '最近提交', readme: 'README' };
  const projects = [
    { id: 'mori', owner: 'mori-labs', name: 'mori-notes', desc: '把想法留在本地。一款安静、轻巧的 Markdown 笔记应用。', language: 'Kotlin', stars: '2.4k', time: '2 小时前', glyph: 'm' },
    { id: 'lumen', owner: 'lumen-team', name: 'lumen-ui', desc: '为 Android 打造的界面组件。细腻的动效，恰到好处的留白。', language: 'Kotlin', stars: '860', time: '昨天', glyph: 'L' }
  ];
  const state = {};
  function defaults(style) { return { screen: 'discover', filter: '为你', searchType: '仓库', query: '', searchRan: false, settingsGroup: '导航', tabs: Object.keys(tabNames), visible: Object.keys(tabNames), modules: Object.keys(modules), starred: [], density: style === 'ledger' ? 'compact' : 'comfortable', radius: ['mono','ledger','cover'].includes(style) ? 4 : 14, project: 'mori', repoTab: '概览', inboxRead: false, language: '全部', order: '最匹配', issueStatus: '全部' }; }
  function hydrate(snapshot) {
    const saved = snapshot && snapshot.privateContent && snapshot.privateContent.variants;
    Object.keys(names).forEach(function(style) {
      const base = defaults(style); const previous = saved && saved[style];
      const next = previous && typeof previous === 'object' ? Object.assign({}, base, previous) : base;
      if (state[style]) Object.assign(state[style], next); else state[style] = next;
      state[style].tabs = Array.isArray(state[style].tabs) ? Array.from(new Set(state[style].tabs.filter(x => tabNames[x]))) : base.tabs;
      Object.keys(tabNames).forEach(x => { if (!state[style].tabs.includes(x)) state[style].tabs.push(x); });
      state[style].visible = Array.isArray(state[style].visible) ? state[style].visible.filter(x => tabNames[x]) : base.visible;
      if (!state[style].visible.length) state[style].visible = ['discover'];
      state[style].modules = Array.isArray(state[style].modules) ? state[style].modules.filter(x => modules[x]) : Object.keys(modules);
      state[style].starred = Array.isArray(state[style].starred) ? state[style].starred.filter(x => projects.some(p => p.id === x)) : [];
    });
  }
  hydrate(window.openai && window.openai.widgetState);
  function esc(value) { return String(value).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function icon(name) { return '<i data-lucide="' + name + '" aria-hidden="true"></i>'; }
  function button(action, value, label, content, extra) { return '<button type="button" class="cursor-interaction ' + (extra || '') + '" data-action="' + action + '" data-value="' + esc(value) + '" aria-label="' + esc(label) + '">' + content + '</button>'; }
  function chips(values, current, action, cls) { return '<div class="chips ' + (cls || '') + '" aria-label="' + (action === 'searchType' ? '搜索类型' : '内容选择') + '">' + values.map(v => '<button type="button" class="cursor-interaction" data-action="' + action + '" data-value="' + esc(v) + '" aria-pressed="' + (current === v) + '">' + esc(v) + '</button>').join('') + '</div>'; }
  function projectCard(p, s) { const starred = s.starred.includes(p.id); return '<article class="repo-card"><div class="repo-head"><div class="avatar">' + p.glyph + '</div>' + button('project', p.id, '查看 ' + p.name, '<small>' + p.owner + '</small><strong>' + p.name + '</strong>', 'repo-open') + button('star', p.id, starred ? '取消收藏 ' + p.name : '收藏 ' + p.name, icon('star'), 'iconbutton' + (starred ? ' starred' : '')) + '</div><p class="repo-desc">' + p.desc + '</p><div class="meta"><span>' + icon('code-2') + p.language + '</span><span>' + icon('star') + p.stars + '</span><span>' + p.time + '</span></div></article>'; }
  function row(iconName, title, subtitle, trailing) { return '<div class="item"><span class="lead-icon">' + icon(iconName) + '</span><div class="grow">' + title + '<small>' + subtitle + '</small></div>' + (trailing || '') + '</div>'; }
  function discover(s, style) {
    let items = s.filter === '已收藏' ? projects.filter(p => s.starred.includes(p.id)) : s.filter === '最近更新' ? projects.slice().reverse() : projects;
    const filters = chips(['为你', '最近更新', '已收藏'], s.filter, 'filter');
    const sample = '<div class="footnote">示例内容 · ' + items.length + ' 个项目</div>';
    if (items.length && style === 'ledger') return filters + '<div class="ledger-head"><span>项目速览</span><span>Android / 开源工具</span></div>' + items.map(function(p) {
      return '<article class="ledger-project">' + projectCard(p,s) + '<div class="ledger-stats"><span><small>Release</small>v1.8.0</span><span><small>Issue</small>12</span><span><small>PR</small>3</span><span><small>CI</small>通过</span></div><div class="latest-line">' + icon('git-commit-horizontal') + '<span>优化大文件的加载速度 · main</span></div></article>';
    }).join('') + sample;
    if (items.length && style === 'stream') return filters + items.map(function(p,index) {
      return '<article class="activity-post"><div class="activity-head"><div class="avatar">' + p.glyph + '</div><div><strong>' + p.owner + '</strong><small>' + (index === 0 ? '发布了新版本' : '更新了仓库') + ' · ' + p.time + '</small></div></div><div class="activity-content">' + projectCard(p,s) + '<div class="activity-note"><span>' + (index === 0 ? 'v1.8.0 · 新版本' : 'main · 最近提交') + '</span><p>' + (index === 0 ? '新增离线搜索，优化启动体验。' : '优化大文件的加载速度。') + '</p></div></div></article>';
    }).join('') + sample;
    if (items.length && style === 'cover') {
      const p = items[0];
      return filters + '<article class="feature-project"><div class="cover-art"><small>' + p.name.toUpperCase() + ' / README</small><h2>' + (p.id === 'mori' ? '把想法<br>留在本地。' : '让每一次交互<br>恰到好处。') + '</h2><span>ANDROID · OPEN SOURCE</span></div>' + projectCard(p,s) + button('project',p.id,'阅读 '+ p.name,'阅读项目 ' + icon('arrow-up-right'),'read-project') + '</article>' + (items.length > 1 ? '<div class="next-project"><small class="muted">接着看</small>' + projectCard(items[1],s) + '</div>' : '') + sample;
    }
    return chips(['为你', '最近更新', '已收藏'], s.filter, 'filter') + '<div class="hero"><small>THE OPEN SOURCE JOURNAL</small><h2>发现下一份<br>灵感。</h2><p>好项目，值得慢慢看。</p></div><div class="eyebrow">' + icon('sliders-horizontal') + '你的兴趣 · Android / 开源工具</div>' + (items.length ? items.map(p => projectCard(p, s)).join('') : '<div class="empty">' + icon('bookmark') + '收藏喜欢的项目后，会出现在这里。</div>') + '<div class="footnote">示例内容 · ' + items.length + ' 个项目</div>';
  }
  function repo(s) {
    const p = projects.find(p => p.id === s.project) || projects[0];
    let out = '<div class="repo-summary"><small class="muted">' + p.owner + ' /</small><h1>' + p.name + '</h1><p>' + p.desc + '</p><div class="meta"><span>' + icon('star') + p.stars + '</span><span>Kotlin</span><span>Apache-2.0</span></div></div>' + chips(['概览', '代码', '讨论'], s.repoTab, 'repoTab', 'detail-tabs');
    if (s.repoTab === '代码') return out + '<div class="box">' + row('git-branch','main','示例分支') + row('folder','app','Android 应用') + row('folder','core','基础模块') + row('file-text','README.md','项目介绍') + row('file-code','build.gradle.kts','构建配置') + '</div>';
    if (s.repoTab === '讨论') return out + row('message-circle','你希望下个版本支持什么？','功能建议 · 12 条回复') + row('message-circle','分享你的使用方式','交流 · 8 条回复');
    const content = {
      release: '<div class="box"><div class="group-head"><span>' + icon('package') + '最新版本</span><small class="muted">昨天</small></div><h3>v1.8.0</h3><small class="muted">新增离线搜索，优化启动体验。</small></div>',
      work: '<div class="box"><div class="data-line"><span>Issue</span><strong>12 个开放</strong></div><div class="data-line"><span>Pull request</span><strong>3 个待合并</strong></div></div>',
      actions: '<div class="box"><div class="group-head"><span>' + icon('circle-check') + 'Actions</span><small class="muted">6 分钟前</small></div><small>Android CI · 通过</small></div>',
      activity: '<div class="box"><div class="group-head"><span>' + icon('git-commit-horizontal') + '最近提交</span><small class="muted">2 小时前</small></div><small>优化大文件的加载速度</small></div>',
      readme: '<div class="box"><div class="group-head"><span>' + icon('book-open') + 'README</span></div><small>' + p.desc + '</small></div>'
    };
    return out + (s.modules.length ? s.modules.map(k => content[k]).join('') : '<div class="empty">尚未选择概览模块</div>') + button('settings', '仓库概览', '自定义仓库概览', icon('sliders-horizontal') + ' 自定义概览', 'filled');
  }
  function search(s) {
    let out = '<form class="searchbox" data-search-form>' + icon('search') + '<input aria-label="搜索内容" data-query value="' + esc(s.query) + '" placeholder="搜索开源世界" autocomplete="off">' + button('runSearch', '', '搜索', icon('arrow-right'), 'iconbutton') + '</form>' + chips(['仓库', '代码', 'Issue', 'PR', '用户'], s.searchType, 'searchType');
    if (s.searchType === '仓库' || s.searchType === '代码') out += '<div class="filterbar"><label>语言<select aria-label="语言" data-field="language"><option' + (s.language === '全部' ? ' selected' : '') + '>全部</option><option' + (s.language === 'Kotlin' ? ' selected' : '') + '>Kotlin</option><option' + (s.language === 'TypeScript' ? ' selected' : '') + '>TypeScript</option></select></label>' + (s.searchType === '仓库' ? '<label>排序<select aria-label="排序" data-field="order">' + ['最匹配','Star 最多','最近更新'].map(x => '<option' + (s.order === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label>' : '') + '</div>';
    if (s.searchType === 'Issue' || s.searchType === 'PR') out += '<div class="filterbar"><label>状态<select aria-label="状态" data-field="issueStatus">' + ['全部','开放','已关闭'].map(x => '<option' + (s.issueStatus === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label><small class="muted">范围：所有公开仓库</small></div>';
    if (!s.searchRan) return out + '<div class="section-label">试着搜一搜</div>' + button('suggest', 'notes', '搜索 notes', 'notes') + button('suggest', 'android', '搜索 android', 'android') + '<div class="notice">示例搜索 · 输入后查看类型与筛选的变化</div>';
    const q = s.query.trim().toLowerCase();
    out += '<div class="section-label" role="status">' + esc(s.searchType) + ' · 示例结果</div>';
    if (s.searchType === '仓库') { let matches = projects.filter(p => (!q || q === 'android' || (p.name + p.desc).toLowerCase().includes(q)) && (s.language === '全部' || s.language === p.language)); if (s.order === '最近更新') matches = matches.slice().reverse(); return out + (matches.length ? matches.map(p => projectCard(p, s)).join('') : '<div class="empty">示例库中没有匹配项目</div>'); }
    if (s.searchType === '代码') return out + (s.language === 'TypeScript' ? '<div class="empty">示例库中没有匹配代码</div>' : row('file-code','NotesScreen.kt','mori-labs / mori-notes · app/ui') + '<div class="code">@Composable<br>fun NotesScreen() {<br>&nbsp; NotesList(notes = state.notes)<br>}</div>');
    if (s.searchType === '用户') return out + row('user-round','mori-labs','开源笔记与 Android 工具') + row('user-round','lumen-team','用心打磨每一次交互');
    return out + (s.issueStatus === '已关闭' ? row('circle-check', s.searchType === 'PR' ? '合并离线搜索模块' : '修复首次启动闪退', 'mori-labs / mori-notes · 已关闭') : row(s.searchType === 'PR' ? 'git-pull-request' : 'circle-dot', s.searchType === 'PR' ? '支持自定义主题' : '增加笔记的标签筛选', 'mori-labs / mori-notes · 开放'));
  }
  function settings(s) {
    let out = chips(['导航','仓库概览'], s.settingsGroup, 'settingsGroup');
    if (s.settingsGroup === '导航') {
      out += '<div class="section-label">显示的选项卡 · 按箭头调整顺序</div>';
      s.tabs.forEach(function(key,index) { out += '<div class="setting-row"><label class="cursor-interaction"><input type="checkbox" data-toggle-tab="' + key + '" ' + (s.visible.includes(key) ? 'checked' : '') + (s.visible.length === 1 && s.visible.includes(key) ? ' disabled' : '') + '>' + icon(tabIcons[key]) + tabNames[key] + '</label>' + (index > 0 ? button('moveTab',key, '上移' + tabNames[key],icon('arrow-up'),'iconbutton') : '') + '</div>'; });
      out += '<div class="notice">至少保留一个选项卡。搜索与设置始终可从顶部打开。</div>';
    } else {
      out += '<div class="section-label">显示的概览模块</div>';
      Object.keys(modules).forEach(function(key) { out += '<div class="setting-row"><label class="cursor-interaction"><input type="checkbox" data-toggle-module="' + key + '" ' + (s.modules.includes(key) ? 'checked' : '') + '>' + modules[key] + '</label></div>'; });
      out += '<div class="notice">关闭模块后，仍可通过仓库详情入口访问。</div>';
    }
    return out + button('doneSettings', '', '查看调整后的界面', '查看效果 ' + icon('arrow-right'), 'filled');
  }
  function render(style) {
    const s = state[style], phone = root.querySelector('[data-style="' + style + '"]');
    phone.style.setProperty('--app-radius', s.radius + 'px'); phone.dataset.density = s.density;
    const detail = ['repo','search','settings'].includes(s.screen);
    const title = s.screen === 'repo' ? '仓库' : s.screen === 'search' ? '搜索' : s.screen === 'settings' ? '自定义' : tabNames[s.screen] || '发现';
    let html = '<div class="status"><span>9:41</span><span>' + icon('wifi') + icon('battery-full') + '</span></div><header class="topbar">' + (detail ? button('back','','返回',icon('arrow-left'),'iconbutton') : '') + '<h1>' + title + '</h1><div class="actions">' + (s.screen !== 'search' ? button('screen','search','打开搜索',icon('search'),'iconbutton') : '') + (s.screen !== 'settings' ? button('settings',s.screen === 'repo' ? '仓库概览' : '导航','自定义界面',icon('sliders-horizontal'),'iconbutton') : '') + '</div></header><main class="body">';
    if (s.screen === 'discover') html += discover(s,style);
    else if (s.screen === 'repo') html += repo(s);
    else if (s.screen === 'search') html += search(s);
    else if (s.screen === 'settings') html += settings(s);
    else if (s.screen === 'repos') html += '<div class="eyebrow">' + icon('pin') + '置顶仓库</div>' + projects.map(p => projectCard(p,s)).join('');
    else if (s.screen === 'saved') html += s.starred.length ? projects.filter(p => s.starred.includes(p.id)).map(p => projectCard(p,s)).join('') : '<div class="empty">' + icon('bookmark') + '收藏感兴趣的项目，留待慢慢看。</div>';
    else if (s.screen === 'inbox') html += '<div class="eyebrow">' + (s.inboxRead ? '全部已读' : '2 条未读') + '</div>' + row('git-pull-request','支持自定义主题','mori-notes · 请求你的审核',s.inboxRead ? icon('check') : '') + row('package','v1.8.0 已发布','mori-notes · 昨天',s.inboxRead ? icon('check') : '') + button('read','','切换已读状态',s.inboxRead ? '撤销全部已读' : '全部标为已读','filled');
    html += '</main><nav class="navbar" aria-label="主导航">' + s.tabs.filter(k => s.visible.includes(k)).map(k => '<button type="button" class="cursor-interaction" data-action="screen" data-value="' + k + '"' + (s.screen === k ? ' aria-current="page"' : '') + '><span>' + icon(tabIcons[k]) + '</span>' + tabNames[k] + '</button>').join('') + '</nav><div class="homebar"></div>';
    phone.innerHTML = html;
    if (globalThis.lucide) lucide.createIcons({ attrs: { width: 20, height: 20 } });
  }
  function save(style) {
    if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({modelContent: { recentlyEditedStyle: names[style], choices: Object.fromEntries(Object.keys(names).map(k => [names[k], { density: state[k].density, visibleTabs: state[k].tabs.filter(t => state[k].visible.includes(t)).map(t => tabNames[t]), repositoryModules: state[k].modules.map(m => modules[m]), searchType: state[k].searchType }])) }, privateContent: { variants: state }}).catch(function(){});
  }
  Object.keys(names).forEach(render);
  root.addEventListener('click', function(event) {
    const target = event.target.closest('button[data-action]'); if (!target || !root.contains(target)) return;
    const phone = target.closest('[data-style]'); const style = phone.dataset.style, s = state[style], action = target.dataset.action, value = target.dataset.value;
    if (action === 'screen') s.screen = value;
    else if (action === 'back') s.screen = s.visible.includes('discover') ? 'discover' : s.tabs.find(k => s.visible.includes(k));
    else if (action === 'project') { s.project = value; s.screen = 'repo'; s.repoTab = '概览'; }
    else if (action === 'settings') { s.settingsGroup = value; s.screen = 'settings'; }
    else if (action === 'doneSettings') { s.screen = s.settingsGroup === '仓库概览' ? 'repo' : s.tabs.find(k => s.visible.includes(k)); }
    else if (action === 'moveTab') { const i = s.tabs.indexOf(value); if (i > 0) [s.tabs[i-1],s.tabs[i]] = [s.tabs[i],s.tabs[i-1]]; }
    else if (action === 'star') { s.starred = s.starred.includes(value) ? s.starred.filter(x => x !== value) : s.starred.concat(value); }
    else if (action === 'read') s.inboxRead = !s.inboxRead;
    else if (action === 'suggest') { s.query = value; s.searchRan = true; }
    else if (action === 'runSearch') { s.query = phone.querySelector('[data-query]').value; s.searchRan = true; }
    else if (['filter','searchType','repoTab','settingsGroup'].includes(action)) s[action] = value;
    render(style); save(style);
  });
  root.addEventListener('input', function(event) { if (event.target.matches('[data-query]')) state[event.target.closest('[data-style]').dataset.style].query = event.target.value; });
  root.addEventListener('submit', function(event) { if (!event.target.matches('[data-search-form]')) return; event.preventDefault(); const style = event.target.closest('[data-style]').dataset.style; state[style].searchRan = true; render(style); save(style); });
  root.addEventListener('change', function(event) {
    const element = event.target, phone = element.closest('[data-style]'); if (!phone) return;
    const style = phone.dataset.style, s = state[style];
    if (element.hasAttribute('data-toggle-tab')) { const key = element.dataset.toggleTab; s.visible = element.checked ? Array.from(new Set(s.visible.concat(key))) : s.visible.filter(x => x !== key); }
    else if (element.hasAttribute('data-toggle-module')) { const key = element.dataset.toggleModule; s.modules = element.checked ? Array.from(new Set(s.modules.concat(key))) : s.modules.filter(x => x !== key); }
    else if (element.hasAttribute('data-field')) s[element.dataset.field] = element.value;
    else return;
    render(style); save(style);
  });
  window.addEventListener('openai:set_globals', function(event) { const globals = event.detail && event.detail.globals; if (globals && Object.prototype.hasOwnProperty.call(globals,'widgetState')) { hydrate(globals.widgetState); Object.keys(names).forEach(render); } });
  if (globalThis.Tweak) Object.keys(names).forEach(function(style) {
    const tweak = new Tweak({ container: root.querySelector('[data-style="' + style + '"]'), onChange: function() { render(style); } });
    tweak.addSelect(state[style], 'density', { label: '信息密度', options: [{ label: '舒适', value: 'comfortable' },{ label: '紧凑', value: 'compact' }] });
    tweak.addSlider(state[style], 'radius', { label: '模块圆角', min: 0, max: 28, unit: 'px' });
  });
})();
</script>
